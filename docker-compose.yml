services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5105:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__Provider: Postgres
      Database__PostgresConnectionString: Host=postgres;Port=5432;Database=ai_governance_gateway;Username=ai_governance_gateway;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      Cache__Enabled: "true"
      Cache__Provider: Redis
      Cache__ConnectionString: redis:6379
      Bootstrap__AdminUsername: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      Bootstrap__AdminPassword: ${BOOTSTRAP_ADMIN_PASSWORD:?Set BOOTSTRAP_ADMIN_PASSWORD}
      AI_GOVERNANCE_GATEWAY_OIDC_CLIENT_SECRET: ${AI_GOVERNANCE_GATEWAY_OIDC_CLIENT_SECRET:?Set AI_GOVERNANCE_GATEWAY_OIDC_CLIENT_SECRET}
      Auth__SigningKey: ${AUTH_SIGNING_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ai_governance_gateway
      POSTGRES_USER: ai_governance_gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - ai-governance-gateway-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_governance_gateway -d ai_governance_gateway"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ai-governance-gateway-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  ai-governance-gateway-postgres:
  ai-governance-gateway-redis:
