<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCP Proxy Admin</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="login-view">
  <div class="card shadow border-0" style="width: 380px;">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <i class="bi bi-hdd-network fs-1 text-primary"></i>
        <h5 class="mt-2 mb-0 fw-bold">MCP Proxy Admin</h5>
      </div>

      <div id="oidc-login-section" class="mb-3 d-none">
        <a id="oidc-login-btn" href="/account/login" class="btn btn-primary w-100 py-2 fw-semibold mb-2">
          <i class="bi bi-microsoft me-2"></i>Sign in with OIDC / Entra ID
        </a>
        <div class="d-flex align-items-center my-3 text-secondary small">
          <hr class="flex-grow-1 my-0"><span class="px-2">or local login</span><hr class="flex-grow-1 my-0">
        </div>
      </div>

      <form id="login-form">
        <div class="mb-2">
          <label class="form-label small">Username</label>
          <input type="text" class="form-control" id="login-username" autocomplete="username" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label small">Password</label>
          <input type="password" class="form-control" id="login-password" autocomplete="current-password" required>
        </div>
        <div id="login-error" class="text-danger small mb-2 d-none"></div>
        <button type="submit" class="btn btn-outline-primary w-100"><i class="bi bi-box-arrow-in-right me-1"></i>Local Sign in</button>
      </form>
    </div>
  </div>
</div>

<div id="app-view">
  <div id="sidebar">
    <div class="sb-brand"><i class="bi bi-hdd-network"></i>MCP Proxy</div>
    <nav class="sb-nav" id="main-tabs">
      <a data-tab="servers" class="active"><i class="bi bi-hdd-network"></i>Servers</a>
      <a data-tab="users"><i class="bi bi-people"></i>Users</a>
      <a data-tab="roles"><i class="bi bi-person-badge"></i>Roles</a>
      <a data-tab="apikeys"><i class="bi bi-key"></i>API Keys</a>
      <a data-tab="permissions"><i class="bi bi-shield-check"></i>Permissions</a>
    </nav>
    <div class="sb-foot">
      <div class="text-white-50 small mb-2" id="whoami"></div>
      <button id="logout-btn" class="btn btn-sm btn-outline-secondary w-100"><i class="bi bi-box-arrow-left me-1"></i>Sign out</button>
    </div>
  </div>
  <main id="main">
    <div id="tab-servers" class="tab-pane active"></div>
    <div id="tab-users" class="tab-pane"></div>
    <div id="tab-roles" class="tab-pane"></div>
    <div id="tab-apikeys" class="tab-pane"></div>
    <div id="tab-permissions" class="tab-pane"></div>
  </main>
</div>

<div id="toast-area" class="position-fixed top-0 end-0 p-3" style="z-index: 1080; pointer-events: none;"></div>

<div class="modal fade" id="generic-modal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="generic-modal-title"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="generic-modal-body"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
